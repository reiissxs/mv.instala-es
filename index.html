<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MV Instalações — Gestão Operacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#08152F">
<style>
:root{
  --navy:#1B3A7A;--ndk:#0F2354;--nlt:#2A5298;
  --ok:#22C55E;--warn:#F59E0B;--err:#EF4444;
  --bg:#EEF2FA;--white:#fff;--bdr:#CBD5E1;
  --txt:#1E293B;--muted:#64748B;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;}
button{cursor:pointer;font-family:inherit;}
input,select{font-family:inherit;}
a{text-decoration:none;}

/* ── UTILITIES ── */
.flex{display:flex;}.flex-col{flex-direction:column;}.items-center{align-items:center;}.justify-between{justify-content:space-between;}.justify-center{justify-content:center;}
.gap4{gap:4px;}.gap8{gap:8px;}.gap10{gap:10px;}.gap12{gap:12px;}.gap14{gap:14px;}.gap16{gap:16px;}
.w100{width:100%;}.flex1{flex:1;}.shrink0{flex-shrink:0;}
.text-center{text-align:center;}
.bold{font-weight:700;}.bolder{font-weight:800;}.boldest{font-weight:900;}
.card{background:var(--white);border-radius:14px;border:1px solid var(--bdr);padding:20px;}
.hidden{display:none!important;}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── LOGIN ── */
#login{min-height:100vh;background:linear-gradient(150deg,var(--ndk) 0%,var(--nlt) 100%);display:flex;flex-direction:column;align-items:center;padding:32px 20px;}
.logo-box{background:rgba(255,255,255,.07);border-radius:20px;padding:22px 36px;border:1px solid rgba(255,255,255,.1);text-align:center;margin-bottom:12px;}
.logo-mv{font-family:'Arial Black',sans-serif;font-size:32px;font-weight:900;color:#fff;line-height:1;}
.logo-sub{font-size:8px;font-weight:700;letter-spacing:2.5px;color:rgba(255,255,255,.55);text-transform:uppercase;margin-top:2px;}
.login-label{color:rgba(255,255,255,.7);font-size:14px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin:20px 0;}
.access-wrap{width:100%;max-width:900px;display:flex;flex-direction:column;align-items:center;}
.director-area{width:100%;display:flex;justify-content:center;margin-bottom:22px;}
.director-card{width:min(100%,440px);background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.08));border:2px solid rgba(255,255,255,.35);box-shadow:0 18px 45px rgba(0,0,0,.18);position:relative;overflow:hidden;}
.director-card::before{content:'DIRETOR';position:absolute;top:12px;right:12px;background:#fff;color:var(--ndk);font-size:9px;font-weight:900;letter-spacing:1.3px;border-radius:20px;padding:5px 9px;}
.director-card .emp-avatar{width:72px;height:72px;font-size:23px;background:#fff!important;color:var(--ndk);border-color:rgba(255,255,255,.7);}
.director-card .emp-name{font-size:16px;}
.access-divider{width:100%;display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.58);font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 14px;}
.access-divider::before,.access-divider::after{content:'';height:1px;background:rgba(255,255,255,.18);flex:1;}
.emp-grid{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
.emp-card{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.14);border-radius:18px;padding:20px 14px;text-align:center;cursor:pointer;transition:background .2s,transform .2s,border-color .2s;}
.emp-card:hover{background:rgba(255,255,255,.15);transform:translateY(-2px);border-color:rgba(255,255,255,.28);}
.emp-avatar{width:62px;height:62px;border-radius:50%;border:3px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:21px;font-weight:900;color:#fff;}
.emp-name{font-size:13px;font-weight:700;color:#fff;line-height:1.3;margin-bottom:3px;}
.emp-cargo{font-size:11px;color:rgba(255,255,255,.55);font-weight:600;margin-bottom:10px;min-height:16px;}
.emp-btn{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 12px;font-size:12px;color:rgba(255,255,255,.85);font-weight:600;}

/* ── MODAL ── */
#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:900;display:none;align-items:center;justify-content:center;padding:16px;}
#modal-bg.show{display:flex;}
.modal-box{background:#fff;border-radius:16px;width:100%;max-width:420px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 24px 14px;border-bottom:1px solid var(--bdr);}
.modal-title{font-size:17px;font-weight:700;color:var(--navy);}
.modal-close{background:none;border:none;font-size:20px;color:var(--muted);line-height:1;}
.modal-body{padding:22px 24px;display:flex;flex-direction:column;gap:14px;}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast-item{background:#fff;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.1);max-width:340px;pointer-events:auto;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── LAYOUT ADMIN ── */
#admin{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:210px;background:var(--ndk);display:flex;flex-direction:column;height:100vh;flex-shrink:0;transition:width .25s;}
.sidebar.collapsed{width:60px;}
.sb-head{padding:16px 12px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;min-height:68px;}
.sidebar.collapsed .sb-head{justify-content:center;}
.sb-logo{display:flex;flex-direction:column;}
.sidebar.collapsed .sb-logo{display:none;}
.sb-toggle{background:rgba(255,255,255,.08);border:none;border-radius:8px;padding:8px;color:#fff;display:flex;align-items:center;}
.sb-nav{flex:1;padding:10px 6px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;}
.sb-item{background:transparent;border:1.5px solid transparent;border-radius:10px;padding:10px 11px;display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.6);font-size:13px;font-weight:500;width:100%;text-align:left;}
.sb-item.active{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.18);color:#fff;}
.sidebar.collapsed .sb-label{display:none;}
.sb-foot{padding:10px 6px;border-top:1px solid rgba(255,255,255,.08);}
.sidebar.collapsed .sb-user{display:none;}
.sb-user{padding:6px 10px;margin-bottom:6px;}
.sb-user-role{font-size:10px;color:rgba(255,255,255,.4);}
.sb-user-name{font-size:12px;font-weight:700;color:#fff;}
.sb-logout{background:rgba(239,68,68,.12);border:1.5px solid rgba(239,68,68,.25);border-radius:10px;padding:9px 11px;display:flex;align-items:center;gap:10px;color:#FCA5A5;width:100%;}
.sidebar.collapsed .sb-logout span{display:none;}
.admin-main{flex:1;display:flex;flex-direction:column;overflow-y:auto;min-width:0;}
.admin-header{background:#fff;border-bottom:1px solid var(--bdr);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.admin-header h1{font-size:20px;font-weight:800;color:var(--navy);margin:0;}
.admin-header .role-tag{background:var(--ndk);color:#fff;border-radius:20px;padding:4px 14px;font-size:11px;font-weight:700;}
.admin-content{padding:20px 24px;flex:1;}

/* ── PAINEL FUNCIONÁRIO ── */
#employee{min-height:100vh;background:var(--bg);}
.emp-header{background:linear-gradient(135deg,var(--ndk),var(--nlt));padding:18px 18px 0;color:#fff;}
.emp-header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.emp-tabs{display:flex;border-top:1px solid rgba(255,255,255,.12);}
.emp-tab{flex:1;background:none;border:none;padding:11px 4px;color:rgba(255,255,255,.5);font-weight:500;font-size:13px;border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px;}
.emp-tab.active{color:#fff;border-bottom-color:#fff;font-weight:700;}
.emp-body{padding:16px;max-width:640px;margin:0 auto;}

/* ── FORMS ── */
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:13px;font-weight:600;color:var(--txt);}
.field input,.field select{width:100%;padding:10px 14px;border:1.5px solid var(--bdr);border-radius:8px;font-size:14px;color:var(--txt);background:#fff;outline:none;}
.field input:focus,.field select:focus{border-color:var(--navy);}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;border:none;cursor:pointer;white-space:nowrap;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-secondary{background:transparent;color:var(--navy);border:1.5px solid var(--navy);}
.btn-danger{background:var(--err);color:#fff;}
.btn-sm{padding:5px 12px;font-size:12px;}
.btn-lg{padding:13px 24px;font-size:15px;}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.btn-confirm{width:100%;padding:18px;font-size:17px;font-weight:700;background:var(--navy);color:#fff;border:none;border-radius:14px;}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px;}
.stat-card{background:#fff;border-radius:12px;padding:16px 14px;border:1px solid var(--bdr);}
.stat-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.stat-value{font-size:24px;font-weight:800;margin-top:8px;}
.stat-icon{float:right;padding:7px;border-radius:8px;}

/* ── CALENDAR ── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-nav-btn{background:#fff;border:1.5px solid var(--bdr);border-radius:8px;padding:5px 9px;display:flex;align-items:center;}
.cal-month{font-size:15px;font-weight:700;color:var(--navy);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-day-name{text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:3px 0;}
.cal-day{border-radius:7px;padding:4px 2px;text-align:center;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:2px solid var(--bdr);}
.cal-day.today{border-color:var(--navy)!important;}
.cal-day.future{opacity:.5;background:#F1F5F9!important;}
.cal-day.presente{background:#F0FDF4;border-color:#86EFAC;}
.cal-day.falta{background:#FEF2F2;border-color:#FCA5A5;}
.cal-day span:first-child{font-size:12px;font-weight:600;}
.cal-day.today span:first-child{font-weight:800;color:var(--navy);}
.cal-sum{display:flex;gap:8px;margin-top:12px;}
.cal-sum-item{flex:1;background:#fff;border:1.5px solid var(--bdr);border-radius:9px;padding:9px 6px;text-align:center;}
.cal-sum-val{font-size:18px;font-weight:800;}
.cal-sum-lbl{font-size:10px;color:var(--muted);font-weight:600;}

/* ── EFETIVO ── */
.efetivo-row{background:#fff;border:1.5px solid var(--bdr);border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.efetivo-num{font-size:13px;font-weight:700;color:var(--muted);width:20px;text-align:center;}
.efetivo-avatar{width:40px;height:40px;border-radius:50%;background:var(--ndk);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0;}
.efetivo-info{flex:1;}
.efetivo-name{font-size:14px;font-weight:600;}
.efetivo-cargo{font-size:11px;color:var(--muted);}
.efetivo-status{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.status-badge{border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;}
.status-presente{background:#F0FDF4;border:1.5px solid #86EFAC;color:var(--ok);}
.status-falta{background:#FEF2F2;border:1.5px solid #FCA5A5;color:var(--err);}
.status-aguardando{background:#FFFBEB;border:1.5px solid #FDE68A;color:var(--warn);}
.edit-btn{background:var(--bg);border:1.5px solid var(--bdr);border-radius:7px;padding:5px 8px;color:var(--muted);display:flex;}

/* ── TAREFAS ── */
.task-card{background:#fff;border:1.5px solid var(--bdr);border-radius:12px;padding:13px 15px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
.task-card.concluida{border-color:#86EFAC;}
.task-badge{font-size:10px;font-weight:700;border-radius:20px;padding:2px 9px;display:inline-block;margin-bottom:5px;}
.task-badge.pendente{color:var(--warn);background:#FFF7ED;}
.task-badge.concluida{color:var(--ok);background:#F0FDF4;}
.task-desc{font-size:14px;font-weight:600;margin-bottom:4px;}
.task-meta{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
.task-val{font-weight:700;color:var(--navy);}
.task-actions{display:flex;gap:5px;flex-shrink:0;}
.task-btn{border-radius:7px;padding:5px 7px;border:1.5px solid;display:flex;cursor:pointer;}
.task-btn-ok{background:#F0FDF4;border-color:var(--ok);color:var(--ok);}
.task-btn-del{background:#FEF2F2;border-color:var(--err);color:var(--err);}

/* ── CONFIRM ── */
.confirm-box{background:#fff;border-radius:18px;padding:26px 22px;border:1px solid var(--bdr);text-align:center;}
.confirm-day{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px;}
.confirm-date{font-size:26px;font-weight:800;color:var(--navy);}
.confirmed-ok{margin-top:22px;background:#F0FDF4;border:2px solid #86EFAC;border-radius:14px;padding:20px 16px;}
.confirmed-falta{margin-top:22px;background:#FEF2F2;border:2px solid #FCA5A5;border-radius:14px;padding:20px 16px;}
.confirmed-emoji{font-size:36px;margin-bottom:6px;}
.confirmed-title{font-size:18px;font-weight:800;}
.confirmed-time{font-size:13px;color:var(--muted);margin-top:4px;}

/* ── TABLE ── */
.table-wrap{background:#fff;border-radius:16px;border:1px solid var(--bdr);overflow:hidden;}
table{width:100%;border-collapse:collapse;min-width:520px;}
thead tr{background:var(--ndk);}
th{padding:11px 14px;text-align:left;font-size:11px;font-weight:700;color:#fff;}
td{padding:10px 14px;border-bottom:1px solid var(--bdr);font-size:14px;}
tr:nth-child(even) td{background:var(--bg);}

/* ── AVATAR ── */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:var(--navy);flex-shrink:0;}

/* ── SALDO ── */
.saldo-card{background:linear-gradient(135deg,var(--navy),var(--nlt));border-radius:18px;padding:22px 20px;color:#fff;text-align:center;margin-bottom:12px;}
.saldo-label{font-size:12px;color:rgba(255,255,255,.6);font-weight:600;margin-bottom:4px;}
.saldo-total{font-size:34px;font-weight:900;}
.saldo-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:5px;}
.saldo-mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.saldo-mini{border-radius:14px;padding:15px 14px;}
.saldo-mini.pend{background:#FFF7ED;border:2px solid #FDE68A;}
.saldo-mini.done{background:#F0FDF4;border:2px solid #86EFAC;}

/* ── UTIL CLASSES ── */
.mt8{margin-top:8px;}.mt12{margin-top:12px;}.mt14{margin-top:14px;}.mt16{margin-top:16px;}.mt20{margin-top:20px;}
.mb8{margin-bottom:8px;}.mb12{margin-bottom:12px;}.mb14{margin-bottom:14px;}.mb16{margin-bottom:16px;}
.p-info{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;}
.tag{background:var(--ndk);color:#fff;border-radius:20px;padding:4px 14px;font-size:11px;font-weight:700;}
.err-box{background:#FEF2F2;border:1.5px solid var(--err);border-radius:8px;padding:9px 12px;color:var(--err);font-size:13px;}
.loading-center{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--muted);gap:10px;}
.empty-center{text-align:center;padding:40px;color:var(--muted);}
.empty-center svg{opacity:.3;margin-bottom:10px;}

/* ═══════════════════════════════════════════════════════════════════════════
   MV INSTALAÇÕES — PREMIUM UI 2026
   Camada visual: preserva toda a lógica existente do sistema.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --navy:#1546D8;
  --ndk:#08152F;
  --nlt:#2C65F6;
  --ok:#16A66A;
  --warn:#E89A18;
  --err:#E5484D;
  --bg:#F5F7FB;
  --white:#FFFFFF;
  --bdr:#E5EAF1;
  --txt:#162033;
  --muted:#718096;
  --surface:#FFFFFF;
  --surface-2:#F8FAFD;
  --surface-dark:#0A1730;
  --accent:#2F6BFF;
  --accent-2:#5B8CFF;
  --shadow-xs:0 1px 2px rgba(16,24,40,.04);
  --shadow-sm:0 4px 14px rgba(16,24,40,.06);
  --shadow-md:0 12px 34px rgba(16,24,40,.09);
  --shadow-lg:0 24px 70px rgba(5,15,35,.18);
  --radius-sm:10px;
  --radius:16px;
  --radius-lg:22px;
  --ease:cubic-bezier(.2,.8,.2,1);
}

html{background:var(--bg);scroll-behavior:smooth;}
body{
  font-family:'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:
    radial-gradient(circle at 90% -10%,rgba(47,107,255,.07),transparent 30%),
    var(--bg);
  color:var(--txt);
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select{font:inherit;}
button{transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .18s,border-color .18s,color .18s;}
button:active{transform:scale(.985);}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(47,107,255,.16);outline-offset:2px;}
::selection{background:rgba(47,107,255,.18);color:var(--txt);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#CBD4E1;border:2px solid transparent;background-clip:padding-box;border-radius:999px;}

.card{
  background:rgba(255,255,255,.92);
  border:1px solid rgba(221,227,237,.9);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow-xs);
}

/* LOGIN / PORTAL DE ACESSO */
#login{padding:0!important;background:#07142D!important;min-height:100vh;overflow-x:hidden;position:relative;}
#login::before,#login::after{content:'';position:fixed;border-radius:50%;filter:blur(2px);pointer-events:none;}
#login::before{width:620px;height:620px;left:-240px;top:-300px;background:radial-gradient(circle,rgba(46,103,255,.34),rgba(46,103,255,0) 67%);}
#login::after{width:720px;height:720px;right:-330px;bottom:-420px;background:radial-gradient(circle,rgba(74,126,255,.24),rgba(74,126,255,0) 68%);}
#login > div{
  width:100%;min-height:100vh!important;padding:52px 24px 64px!important;
  background:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(145deg,#07142D 0%,#0B1E43 54%,#0A1A39 100%)!important;
  background-size:48px 48px,48px 48px,auto!important;
  position:relative;z-index:1;
}
.logo-box{
  position:relative;background:rgba(255,255,255,.055)!important;
  border:1px solid rgba(255,255,255,.12)!important;
  border-radius:18px!important;padding:18px 28px!important;margin-bottom:14px!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 60px rgba(0,0,0,.16);
  backdrop-filter:blur(14px);
}
.logo-box::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.08),transparent 48%);pointer-events:none;}
.logo-mv{font-family:'Plus Jakarta Sans','Inter',sans-serif!important;font-size:31px!important;letter-spacing:-1.9px!important;font-weight:800!important;}
.logo-sub{font-size:8.5px!important;letter-spacing:2.1px!important;font-weight:700!important;color:rgba(255,255,255,.48)!important;}
#login > div > p[style]{font-size:12px!important;color:rgba(255,255,255,.48)!important;letter-spacing:.015em!important;margin-bottom:29px!important;}
.login-label{font-size:11px!important;letter-spacing:1.8px!important;font-weight:700!important;color:rgba(255,255,255,.48)!important;margin:0 0 18px!important;}
.access-wrap{max-width:1040px!important;}
.director-area{margin-bottom:30px!important;}
.director-card{
  width:min(100%,650px)!important;min-height:142px;
  display:grid!important;grid-template-columns:78px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:20px;row-gap:5px;align-items:center;
  text-align:left!important;padding:26px 28px!important;
  background:linear-gradient(135deg,rgba(255,255,255,.145),rgba(255,255,255,.075))!important;
  border:1px solid rgba(255,255,255,.22)!important;border-radius:24px!important;
  box-shadow:0 26px 70px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.11)!important;
  backdrop-filter:blur(18px);
}
.director-card:hover{transform:translateY(-3px)!important;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.095))!important;border-color:rgba(255,255,255,.32)!important;box-shadow:0 32px 80px rgba(0,0,0,.28)!important;}
.director-card::before{
  content:'DIRETOR';top:16px!important;right:18px!important;
  background:rgba(63,117,255,.18)!important;color:#C7D8FF!important;
  border:1px solid rgba(115,158,255,.30);font-size:8.5px!important;letter-spacing:1.3px!important;padding:5px 9px!important;
}
.director-card .emp-avatar{grid-column:1;grid-row:1/3;margin:0!important;width:70px!important;height:70px!important;background:linear-gradient(145deg,#fff,#DCE7FF)!important;color:#123FBB!important;border:1px solid rgba(255,255,255,.86)!important;box-shadow:0 12px 28px rgba(0,0,0,.15);font-size:21px!important;}
.director-card .emp-name{grid-column:2;grid-row:1;align-self:end;font-size:18px!important;line-height:1.15!important;font-weight:750!important;letter-spacing:-.45px;margin:0!important;}
.director-card .emp-cargo{grid-column:2;grid-row:2;align-self:start;font-size:11.5px!important;color:rgba(255,255,255,.52)!important;margin:0!important;min-height:0!important;}
.director-card .emp-btn{grid-column:3;grid-row:1/3;margin-top:26px;background:#fff!important;color:#153B9E!important;border:none!important;border-radius:12px!important;padding:10px 14px!important;font-size:11.5px!important;font-weight:750!important;box-shadow:0 8px 22px rgba(0,0,0,.12);}
.access-divider{max-width:1040px!important;margin-bottom:17px!important;color:rgba(255,255,255,.40)!important;font-size:9.5px!important;letter-spacing:1.8px!important;}
.access-divider::before,.access-divider::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.14))!important;}
.access-divider::after{background:linear-gradient(90deg,rgba(255,255,255,.14),transparent)!important;}
.emp-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))!important;gap:12px!important;}
.emp-card{
  border:1px solid rgba(255,255,255,.105)!important;border-radius:18px!important;padding:20px 16px 18px!important;
  background:rgba(255,255,255,.052)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
  backdrop-filter:blur(10px);transition:all .22s var(--ease)!important;
}
.emp-card:hover{background:rgba(255,255,255,.085)!important;border-color:rgba(255,255,255,.20)!important;transform:translateY(-3px)!important;box-shadow:0 16px 38px rgba(0,0,0,.16)!important;}
.emp-card .emp-avatar{width:56px;height:56px;border:1px solid rgba(255,255,255,.18)!important;box-shadow:0 10px 25px rgba(0,0,0,.14);font-size:17px!important;margin-bottom:13px!important;background:linear-gradient(145deg,#2451C8,#14398D)!important;}
.emp-card .emp-name{font-size:12.5px!important;font-weight:700!important;letter-spacing:-.15px;}
.emp-card .emp-cargo{font-size:10.5px!important;font-weight:500!important;color:rgba(255,255,255,.45)!important;margin:4px 0 12px!important;}
.emp-card .emp-btn{background:rgba(255,255,255,.07)!important;border:1px solid rgba(255,255,255,.10)!important;border-radius:10px!important;padding:7px 11px!important;font-size:10.5px!important;color:rgba(255,255,255,.72)!important;}
#login-loading{padding:34px 18px!important;font-size:12px!important;color:rgba(255,255,255,.55)!important;}

/* LOADING */
#app-loading{background:linear-gradient(145deg,#07142D,#0C224A)!important;}
#app-loading > div:first-child{background:rgba(255,255,255,.06)!important;border:1px solid rgba(255,255,255,.12)!important;border-radius:18px!important;box-shadow:0 20px 60px rgba(0,0,0,.2)!important;}

/* MODAL */
#modal-bg{background:rgba(5,12,28,.64)!important;backdrop-filter:blur(9px);padding:20px!important;}
.modal-box{
  max-width:440px!important;border-radius:22px!important;border:1px solid rgba(228,233,241,.9)!important;
  box-shadow:0 30px 90px rgba(6,16,36,.30)!important;overflow:hidden!important;
  animation:modalIn .22s var(--ease);
}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{padding:20px 22px 17px!important;border-bottom:1px solid #EDF0F5!important;background:#fff!important;}
.modal-title{font-size:16px!important;font-weight:750!important;color:#17233A!important;letter-spacing:-.25px;}
.modal-close{width:34px;height:34px;border-radius:10px!important;background:#F4F6F9!important;color:#738096!important;font-size:15px!important;display:grid!important;place-items:center;}
.modal-close:hover{background:#EAEFF6!important;color:#1B2940!important;}
.modal-body{padding:22px!important;gap:16px!important;background:#fff;}
.p-info{background:#F7F9FC!important;border:1px solid #E9EDF4!important;border-radius:14px!important;padding:13px 14px!important;}
.p-info .avatar{background:linear-gradient(145deg,#2E68F5,#1748C7)!important;box-shadow:0 7px 18px rgba(47,107,255,.22);}

/* FORMS */
.field{gap:7px!important;}
.field label{font-size:11.5px!important;font-weight:700!important;color:#42506A!important;letter-spacing:.005em;}
.field input,.field select{
  min-height:44px;padding:10px 13px!important;border:1px solid #DCE2EA!important;border-radius:11px!important;
  font-size:13px!important;color:#1E293B!important;background:#FBFCFE!important;box-shadow:inset 0 1px 2px rgba(16,24,40,.02);transition:.18s var(--ease);
}
.field input:hover,.field select:hover{border-color:#C8D1DE!important;background:#fff!important;}
.field input:focus,.field select:focus{border-color:#5D86F7!important;background:#fff!important;box-shadow:0 0 0 4px rgba(47,107,255,.09)!important;outline:none!important;}
.field input::placeholder{color:#A6B0C0;}

/* BUTTONS */
.btn{min-height:40px;border-radius:11px!important;padding:9px 15px!important;font-size:12.5px!important;font-weight:700!important;letter-spacing:-.05px;justify-content:center;}
.btn-primary{background:linear-gradient(180deg,#3472FF,#245FE8)!important;color:#fff!important;box-shadow:0 5px 14px rgba(47,107,255,.20)!important;}
.btn-primary:hover{background:linear-gradient(180deg,#3F79FF,#1F59E0)!important;box-shadow:0 8px 20px rgba(47,107,255,.28)!important;transform:translateY(-1px);}
.btn-secondary{background:#fff!important;color:#34415A!important;border:1px solid #DCE3EC!important;box-shadow:var(--shadow-xs)!important;}
.btn-secondary:hover{background:#F8FAFD!important;border-color:#C7D0DD!important;color:#18243A!important;}
.btn-danger{background:#E5484D!important;color:white!important;box-shadow:0 5px 14px rgba(229,72,77,.18)!important;}
.btn-sm{min-height:34px!important;padding:7px 11px!important;font-size:11px!important;}
.btn-lg{min-height:46px!important;padding:12px 18px!important;font-size:13px!important;}
.btn-confirm{min-height:54px!important;border-radius:14px!important;background:linear-gradient(180deg,#3472FF,#245FE8)!important;box-shadow:0 10px 26px rgba(47,107,255,.24)!important;font-size:13px!important;font-weight:800!important;letter-spacing:.25px!important;}
.btn-confirm:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(47,107,255,.30)!important;}

/* ADMIN LAYOUT */
#admin{background:var(--bg)!important;}
.sidebar{
  width:244px!important;background:linear-gradient(180deg,#09162F 0%,#081226 100%)!important;
  border-right:1px solid rgba(255,255,255,.04);box-shadow:8px 0 30px rgba(11,23,48,.04);transition:width .26s var(--ease)!important;
}
.sidebar.collapsed{width:76px!important;}
.sb-head{min-height:78px!important;padding:18px 14px!important;border-bottom:1px solid rgba(255,255,255,.07)!important;}
.sb-logo>div:first-child{font-family:'Plus Jakarta Sans','Inter',sans-serif!important;font-size:21px!important;letter-spacing:-1.2px!important;}
.sb-logo>div:last-child{font-size:7px!important;letter-spacing:1.8px!important;color:rgba(255,255,255,.36)!important;}
.sb-toggle{width:36px;height:36px;justify-content:center!important;border:1px solid rgba(255,255,255,.08)!important;background:rgba(255,255,255,.055)!important;border-radius:11px!important;color:rgba(255,255,255,.75)!important;}
.sb-toggle:hover{background:rgba(255,255,255,.10)!important;color:#fff!important;}
.sb-nav{padding:16px 10px!important;gap:6px!important;}
.sb-item{
  min-height:44px;padding:10px 12px!important;border:1px solid transparent!important;border-radius:12px!important;
  color:rgba(221,230,244,.58)!important;font-size:12px!important;font-weight:600!important;gap:11px!important;position:relative;
}
.sb-item>span:first-child{width:22px;text-align:center;font-size:16px;filter:saturate(.65);}
.sb-item:hover{background:rgba(255,255,255,.05)!important;color:rgba(255,255,255,.88)!important;}
.sb-item.active{background:linear-gradient(135deg,rgba(63,117,255,.22),rgba(63,117,255,.11))!important;border-color:rgba(91,140,255,.18)!important;color:#fff!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.045);}
.sb-item.active::before{content:'';position:absolute;left:-10px;width:3px;height:22px;border-radius:0 4px 4px 0;background:#5A88FF;box-shadow:0 0 12px rgba(90,136,255,.55);}
.sb-foot{padding:12px 10px 14px!important;border-top:1px solid rgba(255,255,255,.07)!important;}
.sb-user{padding:7px 10px 12px!important;}
.sb-user-role{font-size:9px!important;letter-spacing:.35px;color:rgba(255,255,255,.30)!important;text-transform:uppercase;}
.sb-user-name{font-size:11.5px!important;font-weight:700!important;color:rgba(255,255,255,.88)!important;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-logout{min-height:40px!important;background:rgba(229,72,77,.07)!important;border:1px solid rgba(229,72,77,.12)!important;border-radius:11px!important;padding:9px 11px!important;color:#F49A9E!important;font-size:11.5px!important;font-weight:650;}
.sb-logout:hover{background:rgba(229,72,77,.12)!important;border-color:rgba(229,72,77,.20)!important;}
.admin-main{background:transparent!important;}
.admin-header{
  min-height:78px!important;padding:15px 28px!important;background:rgba(255,255,255,.88)!important;
  border-bottom:1px solid rgba(222,228,237,.86)!important;backdrop-filter:blur(16px);position:sticky;top:0;z-index:40;box-shadow:0 1px 0 rgba(16,24,40,.015);
}
.admin-header>div>div:first-child{font-size:8.5px!important;letter-spacing:1.4px!important;color:#8A97AA!important;}
.admin-header h1{font-size:22px!important;font-weight:750!important;color:#17233A!important;letter-spacing:-.65px!important;margin-top:2px!important;}
.tag{background:#EEF3FF!important;color:#2B61DA!important;border:1px solid #DCE7FF!important;border-radius:999px!important;padding:6px 11px!important;font-size:9px!important;font-weight:800!important;letter-spacing:.65px;}
.admin-content{padding:26px 28px 40px!important;max-width:1500px;width:100%;margin:0 auto;}

/* STATS */
.stats-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))!important;gap:12px!important;margin-bottom:22px!important;}
.stat-card{
  position:relative;overflow:hidden;background:#fff!important;border:1px solid #E5EAF1!important;border-radius:16px!important;padding:17px 16px!important;
  box-shadow:0 3px 12px rgba(16,24,40,.035)!important;transition:.2s var(--ease);
}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(16,24,40,.07)!important;border-color:#D9E1EC!important;}
.stat-card::after{content:'';position:absolute;right:-18px;bottom:-24px;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle,rgba(47,107,255,.045),transparent 70%);}
.stat-label{font-size:9px!important;color:#8A96A8!important;font-weight:750!important;letter-spacing:.8px!important;}
.stat-value{font-size:26px!important;line-height:1!important;font-weight:780!important;letter-spacing:-1px;margin-top:14px!important;}
.stat-icon{border-radius:10px!important;padding:8px!important;font-size:14px!important;}

/* EFETIVO */
.efetivo-row{
  background:#fff!important;border:1px solid #E5EAF1!important;border-radius:14px!important;padding:13px 14px!important;gap:12px!important;margin-bottom:8px!important;
  box-shadow:0 2px 7px rgba(16,24,40,.025);transition:.18s var(--ease);
}
.efetivo-row:hover{border-color:#D7DFEA!important;box-shadow:0 7px 20px rgba(16,24,40,.05)!important;transform:translateY(-1px);}
.efetivo-num{font-size:10px!important;color:#A0AABA!important;width:18px!important;}
.efetivo-avatar,.avatar{background:linear-gradient(145deg,#2D67F3,#1748C7)!important;box-shadow:0 5px 15px rgba(47,107,255,.17);}
.efetivo-avatar{width:38px!important;height:38px!important;font-size:11.5px!important;}
.efetivo-name{font-size:12.5px!important;font-weight:700!important;color:#263248!important;}
.efetivo-cargo{font-size:10px!important;color:#8A96A8!important;margin-top:2px;}
.status-badge{border-radius:999px!important;padding:5px 9px!important;font-size:9.5px!important;font-weight:750!important;border-width:1px!important;letter-spacing:.08px;}
.status-presente{background:#ECFBF4!important;border-color:#C7F0DC!important;color:#11885A!important;}
.status-falta{background:#FFF2F2!important;border-color:#FFD6D8!important;color:#CE3E43!important;}
.status-aguardando{background:#FFF8E9!important;border-color:#F6E3B7!important;color:#B8750E!important;}
.edit-btn{width:32px;height:32px;justify-content:center;align-items:center;background:#F7F9FC!important;border:1px solid #E4E9F0!important;border-radius:9px!important;padding:0!important;color:#748197!important;}
.edit-btn:hover{background:#EDF2FA!important;color:#2A5FCE!important;border-color:#D7E1F0!important;}

/* TABLE */
.table-wrap{border-radius:16px!important;border:1px solid #E3E8EF!important;box-shadow:0 5px 18px rgba(16,24,40,.035)!important;background:#fff!important;}
thead tr{background:#F7F9FC!important;border-bottom:1px solid #E3E8EF!important;}
th{padding:12px 14px!important;font-size:9.5px!important;font-weight:800!important;color:#758297!important;letter-spacing:.65px!important;text-transform:uppercase;}
td{padding:12px 14px!important;border-bottom:1px solid #EEF1F5!important;font-size:12px!important;color:#334057;}
tr:nth-child(even) td{background:#FCFDFE!important;}
tbody tr:hover td{background:#F8FAFD!important;}

/* TASKS */
.task-card{
  background:#fff!important;border:1px solid #E4E9F0!important;border-radius:15px!important;padding:15px 16px!important;margin-bottom:9px!important;
  box-shadow:0 3px 10px rgba(16,24,40,.027)!important;transition:.18s var(--ease);
}
.task-card:hover{border-color:#D4DDE8!important;box-shadow:0 9px 24px rgba(16,24,40,.055)!important;transform:translateY(-1px);}
.task-card.concluida{border-color:#D5EEDF!important;background:linear-gradient(90deg,#fff,#FCFFFD)!important;}
.task-badge{font-size:8.5px!important;font-weight:800!important;letter-spacing:.45px!important;border-radius:999px!important;padding:4px 8px!important;margin-bottom:8px!important;}
.task-badge.pendente{color:#AD710E!important;background:#FFF5DE!important;}
.task-badge.concluida{color:#11885A!important;background:#EAF9F2!important;}
.task-desc{font-size:12.5px!important;font-weight:700!important;color:#273349!important;margin-bottom:7px!important;}
.task-meta{font-size:10.5px!important;color:#8995A7!important;gap:13px!important;}
.task-val{font-weight:800!important;color:#245BD1!important;}
.task-btn{width:32px;height:32px;display:grid!important;place-items:center;border-radius:9px!important;padding:0!important;border-width:1px!important;font-size:12px;}
.task-btn-ok{background:#EEFAF5!important;border-color:#CDECDC!important;color:#11885A!important;}
.task-btn-del{background:#FFF4F4!important;border-color:#FFD8DA!important;color:#D84247!important;}

/* CALENDAR */
.cal-nav{margin-bottom:16px!important;}
.cal-nav-btn{width:34px;height:34px;display:grid!important;place-items:center;padding:0!important;background:#fff!important;border:1px solid #DDE3EB!important;border-radius:10px!important;color:#49566B;box-shadow:var(--shadow-xs);}
.cal-nav-btn:hover{border-color:#C9D3DF!important;background:#F7F9FC!important;}
.cal-month{font-size:13px!important;font-weight:750!important;color:#253249!important;letter-spacing:-.2px;}
.cal-grid{gap:5px!important;}
.cal-day-name{font-size:8.5px!important;font-weight:800!important;color:#99A4B3!important;padding:5px 0!important;text-transform:uppercase;}
.cal-day{min-height:50px!important;border:1px solid #E4E9F0!important;border-radius:10px!important;background:#fff;padding:5px 2px!important;transition:.15s var(--ease);}
.cal-day:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(16,24,40,.05);}
.cal-day.today{border:1.5px solid #4F7DF3!important;box-shadow:0 0 0 3px rgba(47,107,255,.07);}
.cal-day.future{opacity:.52;background:#F6F8FB!important;}
.cal-day.presente{background:#F2FBF7!important;border-color:#CBEADB!important;}
.cal-day.falta{background:#FFF5F5!important;border-color:#F7D1D3!important;}
.cal-day span:first-child{font-size:10.5px!important;font-weight:700!important;}
.cal-day span:last-child{font-size:11px;}
.cal-sum{gap:8px!important;margin-top:14px!important;}
.cal-sum-item{background:#F8FAFD!important;border:1px solid #E5EAF1!important;border-radius:11px!important;padding:10px 6px!important;}
.cal-sum-val{font-size:16px!important;font-weight:800!important;}
.cal-sum-lbl{font-size:8.5px!important;color:#8F9AAB!important;font-weight:700!important;margin-top:2px;}

/* EMPLOYEE APP */
#employee{background:#F5F7FB!important;min-height:100vh;}
.emp-header{
  background:
    radial-gradient(circle at 85% -20%,rgba(85,139,255,.42),transparent 38%),
    linear-gradient(145deg,#091934,#0E2A5C)!important;
  padding:22px 22px 0!important;color:#fff;box-shadow:0 10px 30px rgba(12,29,60,.12);position:relative;
}
.emp-header::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:38px 38px;pointer-events:none;}
.emp-header-top,.emp-tabs{position:relative;z-index:1;max-width:760px;margin-left:auto!important;margin-right:auto!important;}
.emp-header-top{margin-bottom:18px!important;}
#emp-greet{font-size:10px!important;letter-spacing:.3px;color:rgba(255,255,255,.48)!important;}
#emp-firstname{font-size:24px!important;font-weight:760!important;letter-spacing:-.8px!important;margin-top:2px;}
#emp-cargo-label{font-size:10.5px!important;color:rgba(255,255,255,.46)!important;margin-top:4px!important;}
.emp-header-top>div:last-child>div{font-family:'Plus Jakarta Sans','Inter',sans-serif!important;font-size:20px!important;letter-spacing:-1px!important;}
.emp-header-top>div:last-child>button{width:36px;height:36px!important;display:grid!important;place-items:center;padding:0!important;border-radius:11px!important;background:rgba(255,255,255,.065)!important;border:1px solid rgba(255,255,255,.10)!important;color:rgba(255,255,255,.78)!important;backdrop-filter:blur(8px);}
.emp-tabs{border-top:1px solid rgba(255,255,255,.075)!important;gap:4px!important;padding-top:4px;}
.emp-tab{padding:12px 6px 13px!important;font-size:11px!important;font-weight:600!important;color:rgba(255,255,255,.45)!important;border-bottom:2px solid transparent!important;transition:.18s var(--ease);}
.emp-tab:hover{color:rgba(255,255,255,.72)!important;}
.emp-tab.active{color:#fff!important;border-bottom-color:#78A0FF!important;font-weight:750!important;}
.emp-body{padding:22px 16px 44px!important;max-width:760px!important;}
.confirm-box{background:#fff!important;border:1px solid #E4E9F0!important;border-radius:20px!important;padding:27px 22px!important;box-shadow:0 8px 28px rgba(16,24,40,.055)!important;}
.confirm-day{font-size:10px!important;color:#8C98A9!important;font-weight:700!important;letter-spacing:.3px;text-transform:uppercase;}
.confirm-date{font-size:27px!important;font-weight:780!important;color:#1E2C45!important;letter-spacing:-1.1px!important;margin-top:3px;}
.confirmed-ok,.confirmed-falta{margin-top:20px!important;border-width:1px!important;border-radius:15px!important;padding:18px 14px!important;}
.confirmed-ok{background:#EEFAF5!important;border-color:#CDECDC!important;}
.confirmed-falta{background:#FFF4F4!important;border-color:#F6D0D2!important;}
.confirmed-emoji{font-size:28px!important;margin-bottom:7px!important;}
.confirmed-title{font-size:14px!important;font-weight:800!important;}
.confirmed-time{font-size:10.5px!important;margin-top:4px!important;color:#7F8C9F!important;}

/* BALANCE */
.saldo-card{
  background:
    radial-gradient(circle at 85% 5%,rgba(106,153,255,.40),transparent 38%),
    linear-gradient(145deg,#0D2C64,#174EC0)!important;

<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────
const SB  = 'https://oietojrjfibcmarrdwyp.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pZXRvanJqZmliY21hcnJkd3lwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4ODY3MjksImV4cCI6MjA5ODQ2MjcyOX0.cw-SQvVs0hD_FkF4tM4XdztQDosnKPmMeVG9MueaXck';

// Senha padrão temporária definida apenas no HTML. O banco NÃO é alterado.
const DEFAULT_ACCESS_PASSWORD = '1234';

// ─── STATE ─────────────────────────────────────────────────────────────────
let state = { user:null, emp:null, directors:[], employees:[], adminPage:'efetivo', empTab:'presenca', selEmp:null, efeitoInterval:null };

// ─── API ───────────────────────────────────────────────────────────────────
function hdrs(extra){ return Object.assign({ apikey:KEY, Authorization:'Bearer '+KEY, 'Content-Type':'application/json' }, extra||{}); }

async function dbGet(table, params){
  const url = new URL(SB+'/rest/v1/'+table);
  if(params) Object.keys(params).forEach(k=>url.searchParams.set(k,String(params[k])));
  const r = await fetch(url, {headers:hdrs()});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

async function dbPost(table, body){
  const r = await fetch(SB+'/rest/v1/'+table, {method:'POST', headers:hdrs({Prefer:'return=representation'}), body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

async function dbPatch(table, filter, body){
  const url = new URL(SB+'/rest/v1/'+table);
  Object.keys(filter).forEach(k=>url.searchParams.set(k,String(filter[k])));
  const r = await fetch(url, {method:'PATCH', headers:hdrs({Prefer:'return=representation'}), body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

async function dbDelete(table, filter){
  const url = new URL(SB+'/rest/v1/'+table);
  Object.keys(filter).forEach(k=>url.searchParams.set(k,String(filter[k])));
  const r = await fetch(url, {method:'DELETE', headers:hdrs()});
  if(!r.ok) throw new Error(await r.text());
  return true;
}

// ─── UTILS ─────────────────────────────────────────────────────────────────
function todayStr(){ return new Date().toISOString().split('T')[0]; }
function fmtDate(d){ if(!d) return '-'; const p=d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtTime(iso){ if(!iso) return ''; return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function fmtBRL(v){ return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0); }
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const WDAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const WFULL=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const COLORS=['#1B3A7A','#1E4694','#2A5298','#1B3A7A','#14316B','#233F8A','#1B3A7A'];

function getInitials(name){
  const p=(name||'').trim().split(/\s+/);
  return p.length===1?(p[0][0]||'?').toUpperCase():((p[0][0]||'')+(p[1][0]||'')).toUpperCase();
}

function sortByFirst(arr){
  return arr.slice().sort((a,b)=>{
    const fa=(a.full_name||'').trim().split(/\s+/)[0].toLowerCase();
    const fb=(b.full_name||'').trim().split(/\s+/)[0].toLowerCase();
    return fa.localeCompare(fb,'pt-BR');
  });
}

// ─── TOAST ─────────────────────────────────────────────────────────────────
function showToast(msg, type='success'){
  const icons = {success:'✅', error:'❌', info:'ℹ️'};
  const colors = {success:'#22C55E', error:'#EF4444', info:'#1B3A7A'};
  const el = document.createElement('div');
  el.className = 'toast-item';
  el.style.borderLeft = '4px solid '+colors[type];
  el.innerHTML = `<span>${icons[type]}</span><span style="flex:1;font-size:13px;font-weight:500;">${msg}</span><button onclick="this.parentElement.remove()" style="background:none;border:none;font-size:16px;color:#64748B;">✕</button>`;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>el.remove(), 3500);
}

// ─── MODAL ─────────────────────────────────────────────────────────────────
function openModal(title, html, onMount){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-bg').classList.add('show');
  if(onMount) onMount();
}
function closeModal(){ document.getElementById('modal-bg').classList.remove('show'); }

// ─── SHOW/HIDE SCREENS ─────────────────────────────────────────────────────
function showScreen(id){
  ['app-loading','login','admin','employee'].forEach(s=>{ const el=document.getElementById(s); if(el) el.className=(s===id?'':'hidden'); });
  if(id==='login') document.getElementById('login').className='';
}

// ─── LOGIN ─────────────────────────────────────────────────────────────────
// A tela inicial é hierárquica: Diretor primeiro, funcionários abaixo.
// Mantemos o nome loadEmployees() por compatibilidade com o botão "Tentar Novamente".
async function loadEmployees(){
  const loading = document.getElementById('login-loading');
  const errBox  = document.getElementById('login-err');
  const wrap    = document.getElementById('access-wrap');
  loading.classList.remove('hidden');
  errBox.classList.add('hidden');
  wrap.classList.add('hidden');

  try {
    // Diretor/administrador vem da tabela de usuários do sistema.
    // Funcionários continuam vindo de mv_employees.
    const [users, employees] = await Promise.all([
      dbGet('mv_system_users', {select:'id,full_name,username,role,is_active,password_hash', order:'full_name.asc'}),
      dbGet('mv_employees', {select:'*', order:'full_name.asc'})
    ]);

    state.directors = (users||[]).filter(u =>
      u && u.is_active !== false && ['admin','director','diretor'].includes(String(u.role||'').toLowerCase())
    );

    // Evita o Diretor aparecer duas vezes caso ele também possua registro em mv_employees.
    const directorIds = new Set(state.directors.map(d=>String(d.id)));
    state.employees = sortByFirst((employees||[]).filter(e=>
      e && e.status==='ativo' && !directorIds.has(String(e.user_id||''))
    ));

    renderAccessCards();
  } catch(e) {
    loading.classList.add('hidden');
    errBox.classList.remove('hidden');
    document.getElementById('login-err-msg').textContent = e.message;
  }
}

function renderAccessCards(){
  document.getElementById('login-loading').classList.add('hidden');
  const wrap = document.getElementById('access-wrap');
  const directorArea = document.getElementById('director-area');
  const grid = document.getElementById('emp-grid');

  // Sempre prioriza Marcos Vinicius quando houver mais de um administrador.
  const preferredDirector = state.directors.find(d=>/marcos\s+vinicius/i.test(d.full_name||'')) || state.directors[0] || null;

  if(preferredDirector){
    directorArea.innerHTML = `
      <div class="emp-card director-card" onclick="openDirectorLoginModal('${preferredDirector.id}')">

function openDirectorLoginModal(userId){

  const person = {...director, cargo:'Diretor / Administrador'};
  openModal('Acesso do Diretor', loginModalHTML(person, `doDirectorLogin('${director.id}')`));
  setTimeout(()=>document.getElementById('login-pw')?.focus(), 100);
}

async function doDirectorLogin(userId){
  const director = state.directors.find(d=>String(d.id)===String(userId));
  if(!director) return;
  const pw = document.getElementById('login-pw')?.value || '';
  if(!pw.trim()) return;
  const errEl = document.getElementById('login-pw-err');
  errEl.classList.add('hidden');

  if(pw === DEFAULT_ACCESS_PASSWORD){
    state.user = {id:director.id, full_name:director.full_name, username:director.username, role:'admin'};
    state.emp = null;
    closeModal();
    initAdmin();
  } else {
    errEl.textContent = 'Senha incorreta.';
    errEl.classList.remove('hidden');
  }
}

function openLoginModal(empId){
  const emp = state.employees.find(e=>String(e.id)===String(empId));
  if(!emp) return;
  openModal('Acesso do Funcionário', loginModalHTML(emp, `doLogin('${emp.id}')`));
  setTimeout(()=>document.getElementById('login-pw')?.focus(), 100);
}

async function doLogin(empId){
  const emp = state.employees.find(e=>String(e.id)===String(empId));
  if(!emp) return;
  const pw = document.getElementById('login-pw')?.value || '';
  if(!pw.trim()) return;
  const errEl = document.getElementById('login-pw-err');
  errEl.classList.add('hidden');

  if(pw === DEFAULT_ACCESS_PASSWORD){
    // Funcionário nunca herda painel administrativo só porque existe um papel divergente em outra tabela.
    // O acesso admin acontece exclusivamente pelo card do Diretor acima.
    state.user = {id:emp.user_id, full_name:emp.full_name, username:emp.username, role:'employee'};
    state.emp  = emp;
    closeModal();
    initEmployee();
  } else {
    errEl.textContent = 'Senha incorreta.';
    errEl.classList.remove('hidden');
  }
}

function togglePw(id){
  const inp = document.getElementById(id);
  inp.type = inp.type==='password' ? 'text' : 'password';
}

function logout(){
  if(state.efeitoInterval){ clearInterval(state.efeitoInterval); state.efeitoInterval=null; }

// ── EFETIVO ──
async function renderEfetivo(container){
  container.innerHTML = '<div class="loading-center">⏳ Carregando efetivo...</div>';
  const today = todayStr();

  async function loadData(){
    try {
      const att = await dbGet('mv_attendance', {date:'eq.'+today});
      const sorted = sortByFirst(adminEmployees.filter(e=>e.status==='ativo'));
      const attMap = {};
      (att||[]).forEach(a=>attMap[a.employee_id]=a);
      const tPres = (att||[]).filter(a=>a.status==='presente').length;
      const tFalt = (att||[]).filter(a=>a.status==='falta').length;
      const tWait = sorted.length - tPres - tFalt;
      const pct   = sorted.length>0 ? Math.round((tPres/sorted.length)*100) : 0;

      container.innerHTML = `
        <div class="stats-grid">
          ${[['👥','Total',sorted.length,'var(--navy)'],['✅','Presentes',tPres,'var(--ok)'],['❌','Faltas',tFalt,'var(--err)'],['⏳','Aguardando',tWait,'var(--warn)'],['📊','Presença',pct+'%','var(--navy)']].map(([ic,lb,vl,cl])=>`
          <div class="stat-card"><span class="stat-label">${lb}</span><span class="stat-icon" style="background:${cl}18;float:right;border-radius:8px;padding:7px">${ic}</span><div class="stat-value" style="color:${cl}">${vl}</div></div>`).join('')}
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
          <div><h3 style="margin:0;font-size:16px;font-weight:700;color:var(--navy)">Efetivo de Hoje</h3><p style="margin:2px 0 0;font-size:12px;color:var(--muted)">${fmtDate(today)} · atualiza a cada 30s</p></div>
          <button class="btn btn-secondary btn-sm" onclick="renderEfetivo(document.getElementById('admin-content'))">🔄 Atualizar</button>
        </div>
        ${sorted.map((emp,i)=>{
          const a = attMap[emp.id]; const st = a?a.status:'none';
          const sc = st==='presente'?{cls:'status-presente',em:'✅',lb:'Presente'}:st==='falta'?{cls:'status-falta',em:'❌',lb:'Falta'}:{cls:'status-aguardando',em:'⏳',lb:'Aguardando'};
          return `<div class="efetivo-row">
            <div class="efetivo-num">${i+1}</div>
            <div class="efetivo-avatar">${getInitials(emp.full_name)}</div>
            <div class="efetivo-info"><div class="efetivo-name">${emp.full_name}</div>${emp.cargo?'<div class="efetivo-cargo">'+emp.cargo+'</div>':''}</div>
            <div class="efetivo-status">
              <div class="status-badge ${sc.cls}">${sc.em} ${sc.lb}${st==='presente'&&a&&a.registered_at?' · '+fmtTime(a.registered_at):''}</div>
              <button class="edit-btn" onclick="openEditPresenca('${emp.id}','${emp.full_name}','${st}','${a?a.id:''}','${a?encodeURIComponent(a.observation||''):''}')">✏️</button>
            </div>
          </div>`;
        }).join('')}`;
    } catch(e){ container.innerHTML = '<div class="err-box">Erro: '+e.message+'</div>'; }
  }

  await loadData();
  state.efeitoInterval = setInterval(loadData, 30000);
}

function openEditPresenca(empId, empName, curStatus, attId, obsEnc){
  const obs = decodeURIComponent(obsEnc||'');
  openModal('Corrigir: '+empName, `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <button onclick="selectPresencaStatus('presente')" id="ps-presente" class="btn ${curStatus==='presente'?'btn-primary':'btn-secondary'}" style="justify-content:center;padding:13px;"">✅ Presente</button>
      <button onclick="selectPresencaStatus('falta')" id="ps-falta" class="btn ${curStatus==='falta'?'btn-danger':'btn-secondary'}" style="justify-content:center;padding:13px;">❌ Falta</button>
    </div>
    <div class="field"><label>Observação</label><input type="text" id="edit-obs" value="${obs}" placeholder="Ex: atestado médico..."></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="savePresenca('${empId}','${attId}')">💾 Salvar</button>
    </div>
  `);
  window._editPresencaStatus = curStatus==='none'?'':curStatus;
}

function selectPresencaStatus(s){
  window._editPresencaStatus = s;
  const bp = document.getElementById('ps-presente');
  const bf = document.getElementById('ps-falta');
  if(bp){ bp.className = 'btn '+(s==='presente'?'btn-primary':'btn-secondary'); bp.style.justifyContent='center'; bp.style.padding='13px'; }
  if(bf){ bf.className = 'btn '+(s==='falta'?'btn-danger':'btn-secondary'); bf.style.justifyContent='center'; bf.style.padding='13px'; }
}

async function savePresenca(empId, attId){
  const status = window._editPresencaStatus;
  if(!status) return;
  const obs = document.getElementById('edit-obs').value;
  try {
    if(attId){
      await dbPatch('mv_attendance', {id:'eq.'+attId}, {status, observation:obs, registered_at:new Date().toISOString()});
    } else {
      await dbPost('mv_attendance', {employee_id:empId, date:todayStr(), status, observation:obs, registered_at:new Date().toISOString()});
    }
    closeModal(); showToast('Registro atualizado!');
    renderEfetivo(document.getElementById('admin-content'));
  } catch(e){ showToast('Erro: '+e.message,'error'); }
}

async function saveEmpForm(editId, userId){
  const name  = document.getElementById('ef-name').value.trim();
  const user  = document.getElementById('ef-user').value.trim().toLowerCase().replace(/\s/g,'');
  const pw    = document.getElementById('ef-pw').value;
  const cargo = document.getElementById('ef-cargo').value.trim();
  const status= document.getElementById('ef-status').value;
  const errEl = document.getElementById('emp-form-err');
  if(!name||!user||!pw){ errEl.textContent='Preencha os campos obrigatórios.'; errEl.classList.remove('hidden'); return; }
  try {
    if(editId){
      await dbPatch('mv_system_users',{id:'eq.'+userId},{full_name:name,username:user,password_hash:pw});
      await dbPatch('mv_employees',{id:'eq.'+editId},{full_name:name,username:user,password_hash:pw,cargo,status});
    } else {
      const [nu] = await dbPost('mv_system_users',{full_name:name,username:user,password_hash:pw,role:'employee',is_active:true});
      await dbPost('mv_employees',{user_id:nu.id,director_user_id:state.user.id,full_name:name,username:user,password_hash:pw,cargo,status});
    }
    closeModal(); showToast(editId?'Funcionário atualizado!':'Funcionário cadastrado!');
    await loadAdminEmployees(); renderAdminPage('funcionarios');
  } catch(e){ errEl.textContent='Erro: '+e.message; errEl.classList.remove('hidden'); }
}

    showToast('Funcionário excluído.');
    await loadAdminEmployees(); renderAdminPage('funcionarios');
  } catch(e){ showToast('Erro: '+e.message,'error'); }
}

let calState = {};

async function renderCalendar(container, empId, canEdit, year, month){
  const now = new Date();
  if(!year) year = now.getFullYear();
  if(month===undefined) month = now.getMonth();
  const today = todayStr();
  const mm = String(month+1).padStart(2,'0');
  const start = year+'-'+mm+'-01';
  const last  = new Date(year, month+1, 0).getDate();
  const end   = year+'-'+mm+'-'+String(last).padStart(2,'0');

  container.innerHTML = '<div class="loading-center">⏳</div>';

  try {
    const data = await dbGet('mv_attendance', {employee_id:'eq.'+empId, date:'gte.'+start, order:'date.asc', limit:45});
    const recs = {};
    (data||[]).filter(r=>r.date<=end).forEach(r=>{ recs[r.date]=r; });

    const first = new Date(year, month, 1).getDay();
    const pres  = Object.values(recs).filter(r=>r.status==='presente').length;
    const falt  = Object.values(recs).filter(r=>r.status==='falta').length;

    container.innerHTML = `
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="renderCalendar(this.closest('[id]')||this.closest('.card').querySelector('[id]')||this.parentElement.parentElement,arguments[0],'${empId}',${canEdit},${year},${month===0?year-1:year},${month===0?11:month-1})" onclick2="navCal(this,'${empId}',${canEdit},'prev',${year},${month})">←</button>
        <span class="cal-month">${MONTHS[month]} ${year}</span>
        <button class="cal-nav-btn">→</button>
      </div>
      <div class="cal-grid">
        ${WDAYS.map(d=>'<div class="cal-day-name">'+d+'</div>').join('')}
        ${Array.from({length:first}).map((_,i)=>'<div></div>').join('')}
        ${Array.from({length:last}).map((_,i)=>{
          const d=i+1; const ds=year+'-'+mm+'-'+String(d).padStart(2,'0');
          const rec=recs[ds]; const isT=ds===today; const isF=ds>today;
          const st=rec?rec.status:'none';
          const cls=['cal-day',isT?'today':'',isF?'future':st].filter(Boolean).join(' ');
          const em=isF?'🔒':st==='presente'?'✅':st==='falta'?'❌':'⏳';
          const clickable=canEdit&&!isF;
          return '<div class="'+cls+'" '+(clickable?'onclick="openCalEdit(\''+empId+'\',\''+ds+'\',\''+(rec?rec.status:'')+'\',\''+(rec?rec.id:'')+'\',\''+encodeURIComponent(rec?rec.observation||'':'')+'\')" style="cursor:pointer;"':'')+'>'+
            '<span>'+d+'</span><span>'+em+'</span></div>';
        }).join('')}
      </div>
      <div class="cal-sum">
        <div class="cal-sum-item"><div class="cal-sum-val" style="color:var(--ok)">${pres}</div><div class="cal-sum-lbl">Presenças</div></div>
        <div class="cal-sum-item"><div class="cal-sum-val" style="color:var(--err)">${falt}</div><div class="cal-sum-lbl">Faltas</div></div>
        <div class="cal-sum-item"><div class="cal-sum-val" style="color:var(--muted)">${last-Object.keys(recs).length}</div><div class="cal-sum-lbl">Sem reg.</div></div>
      </div>`;

    // Fix nav buttons
    const navBtns = container.querySelectorAll('.cal-nav-btn');
    const prevY = month===0?year-1:year; const prevM = month===0?11:month-1;
    const nextY = month===11?year+1:year; const nextM = month===11?0:month+1;
    navBtns[0].onclick = ()=>renderCalendar(container, empId, canEdit, prevY, prevM);
    navBtns[1].onclick = ()=>renderCalendar(container, empId, canEdit, nextY, nextM);
  } catch(e){ container.innerHTML='<div class="err-box">Erro ao carregar: '+e.message+'</div>'; }
}

function openCalEdit(empId, date, curStatus, attId, obsEnc){
  const obs = decodeURIComponent(obsEnc||'');
  window._calEmpId=empId; window._calDate=date; window._calAttId=attId; window._calStatus=curStatus||'';
  openModal('Registro: '+fmtDate(date), `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <button id="cps-p" class="btn ${curStatus==='presente'?'btn-primary':'btn-secondary'}" style="justify-content:center;padding:13px" onclick="selectCalStatus('presente')">✅ Presente</button>
      <button id="cps-f" class="btn ${curStatus==='falta'?'btn-danger':'btn-secondary'}" style="justify-content:center;padding:13px" onclick="selectCalStatus('falta')">❌ Falta</button>
    </div>
    <div class="field"><label>Observação</label><input type="text" id="cal-obs" value="${obs}" placeholder="Ex: atestado..."></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveCalEdit()">💾 Salvar</button>
    </div>`);
}

function selectCalStatus(s){
  window._calStatus=s;
  const bp=document.getElementById('cps-p'); const bf=document.getElementById('cps-f');
  if(bp){bp.className='btn '+(s==='presente'?'btn-primary':'btn-secondary'); bp.style.justifyContent='center'; bp.style.padding='13px';}
  if(bf){bf.className='btn '+(s==='falta'?'btn-danger':'btn-secondary'); bf.style.justifyContent='center'; bf.style.padding='13px';}
}

async function saveCalEdit(){
  const status=window._calStatus; if(!status) return;
  const obs=document.getElementById('cal-obs').value;
  const empId=window._calEmpId; const date=window._calDate; const attId=window._calAttId;
  try {
    if(attId){ await dbPatch('mv_attendance',{id:'eq.'+attId},{status,observation:obs,registered_at:new Date().toISOString()}); }
    else { await dbPost('mv_attendance',{employee_id:empId,date,status,observation:obs,registered_at:new Date().toISOString()}); }
    closeModal(); showToast('Registro salvo!');
    // Refresh calendar
    const container = document.getElementById('emp-det-cal') || document.getElementById('emp-cal-area');
    if(container) renderCalendar(container, empId, true);
  } catch(e){ showToast('Erro: '+e.message,'error'); }
}

// ─── TAREFAS ───────────────────────────────────────────────────────────────
async function renderTaskList(container, empId, dirId, canCreate, isAdmin){
  container.innerHTML = '<div class="loading-center">⏳ Carregando tarefas...</div>';
  try {
    const tasks = await dbGet('mv_tasks', {employee_id:'eq.'+empId, order:'created_at.desc'});
    const pending = (tasks||[]).filter(t=>t.status==='pendente');
    const done    = (tasks||[]).filter(t=>t.status==='concluida');
    const valP    = pending.reduce((s,t)=>s+Number(t.value),0);
    const valD    = done.reduce((s,t)=>s+Number(t.value),0);

    container.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
        <div style="background:#FFF7ED;border:1.5px solid #FDE68A;border-radius:12px;padding:12px 14px;"><div style="font-size:10px;color:var(--warn);font-weight:700">🔧 EM ANDAMENTO</div><div style="font-size:20px;font-weight:800;color:var(--warn);margin:3px 0 2px">${fmtBRL(valP)}</div><div style="font-size:11px;color:var(--muted)">${pending.length} tarefa(s)</div></div>
        <div style="background:#F0FDF4;border:1.5px solid #86EFAC;border-radius:12px;padding:12px 14px;"><div style="font-size:10px;color:var(--ok);font-weight:700">✓ CONCLUÍDO</div><div style="font-size:20px;font-weight:800;color:var(--ok);margin:3px 0 2px">${fmtBRL(valD)}</div><div style="font-size:11px;color:var(--muted)">${done.length} tarefa(s)</div></div>
      </div>
      ${canCreate?`<button class="btn btn-primary btn-sm" style="margin-bottom:14px" onclick="openCreateTask('${empId}','${dirId}')">➕ Nova Tarefa</button>`:''}
      <div id="task-list-items">
        ${!tasks||tasks.length===0?'<div class="empty-center"><div style="font-size:28px;margin-bottom:8px;">📋</div><p>Nenhuma tarefa</p></div>':
        (tasks).map(t=>`<div class="task-card ${t.status}">
          <div style="flex:1">
            <span class="task-badge ${t.status}">${t.status==='concluida'?'✓ CONCLUÍDA':'🔧 EM ANDAMENTO'}</span>
            <div class="task-desc">${t.description}</div>
            <div class="task-meta">
              <span>${fmtDate(t.created_at?t.created_at.split('T')[0]:'')}</span>
              <span class="task-val">${fmtBRL(t.value)}</span>
              ${t.completed_at?'<span style="color:var(--ok)">✓ '+fmtDate(t.completed_at.split('T')[0])+'</span>':''}
            </div>
          </div>
          <div class="task-actions">
            ${t.status==='pendente'?'<button class="task-btn task-btn-ok" onclick="completeTask(\''+t.id+'\',\''+empId+'\',\''+dirId+'\','+canCreate+','+isAdmin+')">✅</button>':''}
            ${(isAdmin||canCreate)?'<button class="task-btn task-btn-del" onclick="deleteTask(\''+t.id+'\',\''+empId+'\',\''+dirId+'\','+canCreate+','+isAdmin+')">🗑</button>':''}
          </div>
        </div>`).join('')}
      </div>`;
  } catch(e){ container.innerHTML='<div class="err-box">Erro: '+e.message+'</div>'; }
}

function openCreateTask(empId, dirId){
  openModal('Nova Tarefa', `
    <div class="field"><label>Funcionário</label><input type="text" disabled value="${(adminEmployees.find(e=>e.id===empId)||{}).full_name||empId}"></div>
    <div class="field"><label>Descrição *</label><input id="ct-desc" placeholder="Ex: Pintar o shaft..."></div>
    <div class="field"><label>Valor (R$) *</label><input id="ct-val" type="number" placeholder="250.00" step="0.01"></div>
    <div class="field"><label>Status inicial</label><input type="text" value="Em andamento" disabled></div>
    <div id="ct-err" class="err-box hidden"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveTask('${empId}','${dirId}')">💾 Salvar Tarefa</button>
    </div>`);
}

async function saveTask(empId, dirId){
  const desc = document.getElementById('ct-desc').value.trim();
  const val  = document.getElementById('ct-val').value;
  const errEl = document.getElementById('ct-err');
  if(!desc||!val){ errEl.textContent='Preencha todos os campos.'; errEl.classList.remove('hidden'); return; }
  try {
    await dbPost('mv_tasks',{employee_id:empId,director_id:dirId,description:desc,value:parseFloat(val),status:'pendente'});
    closeModal(); showToast('Tarefa criada!');
    const area = document.getElementById('tasks-area-inner')||document.getElementById('emp-det-tasks');
    if(area) renderTaskList(area, empId, dirId, true, true);
  } catch(e){ errEl.textContent='Erro: '+e.message; errEl.classList.remove('hidden'); }
}

async function completeTask(taskId, empId, dirId, canCreate, isAdmin){
  try {
    await dbPatch('mv_tasks',{id:'eq.'+taskId},{status:'concluida',completed_at:new Date().toISOString()});
    showToast('Tarefa concluída! ✓');
    const container = document.getElementById('tasks-area-inner')||document.getElementById('emp-tasks-area')||document.getElementById('emp-det-tasks');
    if(container) renderTaskList(container, empId, dirId, canCreate, isAdmin);
  } catch(e){ showToast('Erro: '+e.message,'error'); }
}

async function deleteTask(taskId, empId, dirId, canCreate, isAdmin){
  if(!confirm('Excluir esta tarefa?')) return;
  try {
    await dbDelete('mv_tasks',{id:'eq.'+taskId});
    showToast('Tarefa excluída.');
    const container = document.getElementById('tasks-area-inner')||document.getElementById('emp-tasks-area')||document.getElementById('emp-det-tasks');
    if(container) renderTaskList(container, empId, dirId, canCreate, isAdmin);
  } catch(e){ showToast('Erro: '+e.message,'error'); }
}

// ─── FUNCIONÁRIO ───────────────────────────────────────────────────────────
function initEmployee(){
  const emp = state.emp; const now = new Date();
  const h = now.getHours();
  document.getElementById('emp-greet').textContent = (h<12?'Bom dia':h<18?'Boa tarde':'Boa noite')+',';
  document.getElementById('emp-firstname').textContent = (emp.full_name||'').trim().split(/\s+/)[0];
  document.getElementById('emp-cargo-label').textContent = emp.cargo||'';
  showScreen('employee');
  setEmpTab('presenca');
}

function setEmpTab(tab){
  state.empTab = tab;
  ['presenca','tarefas','saldo'].forEach(t=>{
    const el = document.getElementById('tab-'+t);
    if(el) el.classList.toggle('active', t===tab);
  });
  renderEmpContent(tab);
}

function renderEmpContent(tab){
  const container = document.getElementById('emp-content');
  if(tab==='presenca') renderEmpPresenca(container);
  else if(tab==='tarefas') renderEmpTarefas(container);
  else renderEmpSaldo(container);
}

async function renderEmpPresenca(container){
  const emp = state.emp; const today = todayStr(); const now = new Date();
  const WDAYS_FULL=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

  let recHtml = '<div style="margin-top:22px;color:var(--muted);font-size:13px;">Verificando...</div>';
  container.innerHTML = `
    <div class="confirm-box" style="margin-top:14px">
      <div class="confirm-day">${WDAYS_FULL[now.getDay()]}</div>
      <div class="confirm-date">${fmtDate(today)}</div>
      <div id="confirm-area">${recHtml}</div>
    </div>
    <div class="card mt14" id="emp-cal-wrapper">
      <h3 style="margin:0 0 14px;color:var(--navy);font-size:15px">Histórico do Mês</h3>
      <div id="emp-cal-area"></div>
    </div>`;

  // Load today's record
  try {
    const data = await dbGet('mv_attendance', {employee_id:'eq.'+emp.id, date:'eq.'+today, limit:1});
    const rec = data&&data[0]?data[0]:null;
    const ca = document.getElementById('confirm-area');
    if(!ca) return;
    if(rec&&rec.status==='presente'){
      ca.innerHTML = `<div class="confirmed-ok"><div class="confirmed-emoji">✅</div><div class="confirmed-title" style="color:var(--ok)">Presença Confirmada</div>${rec.registered_at?'<div class="confirmed-time">às '+fmtTime(rec.registered_at)+'</div>':''}</div>`;
    } else if(rec&&rec.status==='falta'){
      ca.innerHTML = `<div class="confirmed-falta"><div class="confirmed-emoji">❌</div><div class="confirmed-title" style="color:var(--err)">Falta Registrada</div><div class="confirmed-time">Registrado pelo administrador</div></div>`;
    } else {
      ca.innerHTML = `<button class="btn-confirm mt16" onclick="confirmPresenca()">CONFIRMAR PRESENÇA</button>`;
    }
  } catch(e){
    const ca = document.getElementById('confirm-area');
    if(ca) ca.innerHTML = `<button class="btn-confirm mt16" onclick="confirmPresenca()">CONFIRMAR PRESENÇA</button>`;
  }

  renderCalendar(document.getElementById('emp-cal-area'), emp.id, false);
}

async function confirmPresenca(){
  const emp = state.emp;
  const btn = document.querySelector('.btn-confirm');
  if(btn){ btn.disabled=true; btn.textContent='Registrando...'; }
  try {
    const data = await dbPost('mv_attendance', {employee_id:emp.id, date:todayStr(), status:'presente', registered_at:new Date().toISOString(), observation:''});
    const rec = data&&data[0]?data[0]:{status:'presente',registered_at:new Date().toISOString()};
    const ca = document.getElementById('confirm-area');
    if(ca) ca.innerHTML = `<div class="confirmed-ok"><div class="confirmed-emoji">✅</div><div class="confirmed-title" style="color:var(--ok)">Presença Confirmada</div>${rec.registered_at?'<div class="confirmed-time">às '+fmtTime(rec.registered_at)+'</div>':''}</div>`;
    showToast('Presença confirmada com sucesso! ✅');
    renderCalendar(document.getElementById('emp-cal-area'), emp.id, false);
  } catch(e){ showToast('Erro ao confirmar: '+e.message,'error'); if(btn){btn.disabled=false;btn.textContent='CONFIRMAR PRESENÇA';} }
}

function renderEmpTarefas(container){
  container.innerHTML = '<h3 style="margin:14px 0;color:var(--navy);font-size:15px">Minhas Tarefas</h3><div id="emp-tasks-area"></div>';

// ─── PDF ─────────────────────────────────────────────────────────────────────
async function generatePDF(empId){
  const emp = adminEmployees.find(e=>e.id===empId) || state.emp;
  if(!emp) return;
  const now = new Date();
  const mm  = String(now.getMonth()+1).padStart(2,'0');
  const start = now.getFullYear()+'-'+mm+'-01';
  const end   = now.getFullYear()+'-'+mm+'-'+String(new Date(now.getFullYear(),now.getMonth()+1,0).getDate()).padStart(2,'0');
  try {
    const [attData, taskData] = await Promise.all([
      dbGet('mv_attendance',{employee_id:'eq.'+empId,date:'gte.'+start,order:'date.asc',limit:40}),
      dbGet('mv_tasks',{employee_id:'eq.'+empId,order:'created_at.desc'})

    const tasks = taskData||[];

    const falt  = att.filter(r=>r.status==='falta').length;
    const tP    = tasks.filter(t=>t.status==='pendente');
    const tD    = tasks.filter(t=>t.status==='concluida');
    const vP    = tP.reduce((s,t)=>s+Number(t.value),0);
    const vD    = tD.reduce((s,t)=>s+Number(t.value),0);

    const fD    = d=>{if(!d)return'-';const p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];};

    const period= MONTHS[now.getMonth()]+' '+now.getFullYear();

    const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório ${emp.full_name}</title>

    .info{background:#EEF2FA;border-radius:10px;padding:14px 18px;margin-bottom:18px}.info h2{font-size:18px;color:#1B3A7A;margin-bottom:3px}.info p{font-size:12px;color:#64748B}
    .sec{font-size:12px;font-weight:700;color:#1B3A7A;border-left:4px solid #1B3A7A;padding-left:10px;margin:16px 0 10px;text-transform:uppercase}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat{text-align:center;padding:12px 8px;border-radius:8px;border:1.5px solid #CBD5E1}.sv{font-size:20px;font-weight:800}.sl{font-size:10px;color:#64748B;margin-top:2px}

    <div style="text-align:right"><div style="font-size:15px;font-weight:700;color:#1B3A7A">RELATÓRIO INDIVIDUAL</div><div style="font-size:12px;color:#64748B">${period}</div></div></div>

      att.map(r=>'<tr><td>'+fD(r.date)+'</td><td class="'+(r.status==='presente'?'p':'f')+'">'+r.status.toUpperCase()+'</td><td>'+(fT(r.registered_at)||'-')+'</td><td>'+(r.observation||'-')+'</td></tr>').join('')}
    </tbody></table>
    <div class="sec">Resumo de Tarefas</div>
    <div class="stats">
      <div class="stat"><div class="sv" style="color:#F59E0B">${tP.length}</div><div class="sl">Pendentes</div></div>
      <div class="stat"><div class="sv" style="color:#22C55E">${tD.length}</div><div class="sl">Concluídas</div></div>
      <div class="stat"><div class="sv" style="color:#EF4444;font-size:16px">${fR(vP)}</div><div class="sl">Val.Pend.</div></div>
      <div class="stat"><div class="sv" style="color:#22C55E;font-size:16px">${fR(vD)}</div><div class="sl">Val.Conc.</div></div>
    </div>
    <div class="sec">Tarefas</div>
    <table><thead><tr><th>Descrição</th><th>Valor</th><th>Status</th><th>Criada</th><th>Concluída</th></tr></thead><tbody>
    ${tasks.length===0?'<tr><td colspan="5" style="text-align:center;padding:16px;color:#64748B">Nenhuma tarefa</td></tr>':
      tasks.map(t=>'<tr><td>'+t.description+'</td><td style="font-weight:700">'+fR(t.value)+'</td><td class="'+(t.status==='concluida'?'p':'pe')+'">'+t.status.toUpperCase()+'</td><td>'+fD(t.created_at?t.created_at.split('T')[0]:'')+'</td><td>'+(t.completed_at?fD(t.completed_at.split('T')[0]):'-')+'</td></tr>').join('')}
    </tbody></table>
    <div class="footer"><div>Gerado em ${now.toLocaleDateString('pt-BR')} às ${now.toLocaleTimeString('pt-BR')}</div><div>MV Instalações Hidráulicas</div></div>
    <script>window.onload=function(){window.print();}<\/script></body></html>`;

    const win = window.open('','_blank');
    if(win){ win.document.write(html); win.document.close(); }
  } catch(e){ showToast('Erro ao gerar PDF: '+e.message,'error'); }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init(){
  try {
    showScreen('login');
    await loadEmployees();
  } catch(e){
    document.getElementById('app-loading').innerHTML = '<div style="color:#fff;font-size:16px;text-align:center;padding:20px">Erro ao iniciar: '+e.message+'<br><button onclick="init()" style="margin-top:16px;padding:10px 20px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;color:#fff;cursor:pointer;">Tentar novamente</button></div>';
  }
}

init();
</script>
